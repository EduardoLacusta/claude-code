<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Risco - Baixada Santista - CPFL Piratininga</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#0f1117; color:#e2e4e9; }
#map { position:absolute; top:0; left:0; right:0; bottom:0; z-index:1; }

.controls {
  position:absolute; top:16px; left:16px; z-index:1000;
  display:flex; flex-direction:column; gap:8px; max-width:340px;
}
.panel {
  background:rgba(15,17,23,0.92); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.08); border-radius:12px;
  padding:16px; box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.panel h2 {
  font-size:13px; font-weight:700; text-transform:uppercase;
  letter-spacing:1.2px; color:#8b8fa3; margin-bottom:12px;
}
.brand {
  display:flex; align-items:center; gap:10px; margin-bottom:4px;
}
.brand h1 {
  font-size:16px; font-weight:700; color:#fff; line-height:1.2;
}
.brand .sub { font-size:11px; color:#8b8fa3; font-weight:500; }
.brand-dot {
  width:10px; height:10px; border-radius:50%;
  background:#ef4444; box-shadow:0 0 12px rgba(239,68,68,0.5);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow:0 0 8px rgba(239,68,68,0.4); }
  50% { box-shadow:0 0 20px rgba(239,68,68,0.7); }
}

.layer-toggle {
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; border-radius:8px; cursor:pointer;
  transition:background 0.2s; border:none; background:transparent;
  color:#e2e4e9; width:100%; text-align:left; font-family:inherit;
}
.layer-toggle:hover { background:rgba(255,255,255,0.06); }
.layer-toggle .dot {
  width:12px; height:12px; border-radius:50%; flex-shrink:0;
  border:2px solid transparent;
}
.layer-toggle.active .dot { border-color:rgba(255,255,255,0.3); }
.layer-toggle .label { font-size:13px; font-weight:500; flex:1; }
.layer-toggle .count {
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color:#8b8fa3; font-weight:500;
}

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat {
  background:rgba(255,255,255,0.04); border-radius:8px; padding:10px;
}
.stat .val {
  font-family:'JetBrains Mono',monospace; font-size:18px;
  font-weight:700; color:#fff;
}
.stat .lbl { font-size:10px; color:#8b8fa3; margin-top:2px; text-transform:uppercase; letter-spacing:0.5px; }

.view-modes {
  display:flex; gap:4px; background:rgba(255,255,255,0.04);
  border-radius:8px; padding:3px;
}
.view-btn {
  flex:1; padding:6px 10px; border:none; border-radius:6px;
  background:transparent; color:#8b8fa3; font-family:inherit;
  font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s;
}
.view-btn.active { background:rgba(255,255,255,0.1); color:#fff; }

.legend-right {
  position:absolute; bottom:24px; right:16px; z-index:1000;
}
.legend-right .panel { padding:12px 16px; }
.legend-item {
  display:flex; align-items:center; gap:8px; font-size:11px;
  color:#8b8fa3; padding:3px 0;
}
.legend-item .swatch {
  width:14px; height:14px; border-radius:3px; flex-shrink:0;
}

.filter-select {
  width:100%; padding:7px 10px; border-radius:6px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  color:#e2e4e9; font-family:inherit; font-size:12px;
  outline:none; cursor:pointer;
}
.filter-select:focus { border-color:rgba(255,255,255,0.2); }

.leaflet-popup-content-wrapper {
  background:rgba(15,17,23,0.95)!important; color:#e2e4e9!important;
  border:1px solid rgba(255,255,255,0.1)!important;
  border-radius:10px!important; backdrop-filter:blur(12px);
  box-shadow:0 8px 32px rgba(0,0,0,0.5)!important;
}
.leaflet-popup-tip { background:rgba(15,17,23,0.95)!important; }
.leaflet-popup-content { font-family:'DM Sans',sans-serif; font-size:12px; line-height:1.5; margin:10px 14px!important; }
.popup-title { font-weight:700; font-size:13px; color:#fff; margin-bottom:6px; }
.popup-row { display:flex; justify-content:space-between; padding:2px 0; }
.popup-label { color:#8b8fa3; }
.popup-val { color:#e2e4e9; font-weight:500; text-align:right; max-width:180px; }

.leaflet-control-zoom { border:none!important; }
.leaflet-control-zoom a {
  background:rgba(15,17,23,0.9)!important; color:#e2e4e9!important;
  border:1px solid rgba(255,255,255,0.1)!important;
  backdrop-filter:blur(12px); width:32px!important; height:32px!important;
  line-height:32px!important; font-size:16px!important;
}
.leaflet-control-zoom a:hover { background:rgba(30,33,43,0.95)!important; }
</style>
</head>

<div id="map"></div>

<div class="controls">
  <div class="panel">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>Mapa de Risco — Baixada Santista</h1>
        <div class="sub">CPFL Piratininga · Dados SSP-SP 2026</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Visualização</h2>
    <div class="view-modes">
      <button class="view-btn active" onclick="setView('heat')">Heatmap</button>
      <button class="view-btn" onclick="setView('points')">Pontos</button>
      <button class="view-btn" onclick="setView('cluster')">Cluster</button>
    </div>
  </div>

  <div class="panel">
    <h2>Camadas</h2>
    <button class="layer-toggle active" data-layer="criminais" onclick="toggleLayer(this)">
      <div class="dot" style="background:#ef4444"></div>
      <span class="label">Dados Criminais</span>
      <span class="count" id="cnt-criminais">0</span>
    </button>
    <button class="layer-toggle active" data-layer="celulares" onclick="toggleLayer(this)">
      <div class="dot" style="background:#f59e0b"></div>
      <span class="label">Celulares Subtraídos</span>
      <span class="count" id="cnt-celulares">0</span>
    </button>
    <button class="layer-toggle active" data-layer="veiculos" onclick="toggleLayer(this)">
      <div class="dot" style="background:#3b82f6"></div>
      <span class="label">Veículos Subtraídos</span>
      <span class="count" id="cnt-veiculos">0</span>
    </button>
    <button class="layer-toggle active" data-layer="favelas" onclick="toggleLayer(this)">
      <div class="dot" style="background:#a855f7"></div>
      <span class="label">Comunidades / Áreas de Risco</span>
      <span class="count" id="cnt-favelas">—</span>
    </button>
  </div>

  <div class="panel">
    <h2>Filtros</h2>
    <select class="filter-select" id="filterMunicipio" onchange="applyFilters()" style="margin-bottom:6px">
      <option value="">Todos os municípios</option>
      <option value="SANTOS">Santos</option>
      <option value="S.VICENTE">São Vicente</option>
      <option value="GUARUJA">Guarujá</option>
      <option value="PRAIA GRANDE">Praia Grande</option>
      <option value="CUBATAO">Cubatão</option>
      <option value="ITANHAEM">Itanhaém</option>
      <option value="MONGAGUA">Mongaguá</option>
      <option value="PERUIBE">Peruíbe</option>
    </select>
    <select class="filter-select" id="filterNatureza" onchange="applyFilters()">
      <option value="">Todas as naturezas</option>
      <option value="FURTO">Furtos</option>
      <option value="ROUBO">Roubos</option>
      <option value="HOMICÍDIO">Homicídios</option>
      <option value="TRÁFICO">Tráfico</option>
      <option value="LESÃO">Lesão Corporal</option>
    </select>
  </div>

  <div class="panel">
    <h2>Resumo</h2>
    <div class="stat-grid">
      <div class="stat"><div class="val" id="stat-total">0</div><div class="lbl">Ocorrências</div></div>
      <div class="stat"><div class="val" id="stat-roubos">0</div><div class="lbl">Roubos</div></div>
      <div class="stat"><div class="val" id="stat-furtos">0</div><div class="lbl">Furtos</div></div>
      <div class="stat"><div class="val" id="stat-homicidios">0</div><div class="lbl">Homicídios</div></div>
    </div>
  </div>
</div>

<div class="legend-right">
  <div class="panel">
    <h2>Intensidade</h2>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:10px;color:#8b8fa3">Baixa</span>
      <div style="flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#1a3a1a,#22c55e,#eab308,#ef4444,#7f1d1d)"></div>
      <span style="font-size:10px;color:#8b8fa3">Alta</span>
    </div>
  </div>
</div>

const FAVELAS = [
  {name:"Vila Gilda (Dique da Vila Gilda)", lat:-23.9641, lon:-46.3918, mun:"SANTOS", desc:"Maior palafita da América Latina"},
  {name:"Morro São Bento", lat:-23.9556, lon:-46.3399, mun:"SANTOS", desc:"Comunidade no morro"},
  {name:"Morro da Nova Cintra", lat:-23.9610, lon:-46.3365, mun:"SANTOS", desc:"Comunidade no morro"},
  {name:"Morro do José Menino", lat:-23.9701, lon:-46.3548, mun:"SANTOS", desc:"Comunidade no morro"},
  {name:"Vila dos Criadores", lat:-23.9508, lon:-46.3765, mun:"SANTOS", desc:"Área de ocupação"},
  {name:"Dique do Sambaiatuba", lat:-23.9578, lon:-46.3980, mun:"S.VICENTE", desc:"Palafitas e ocupação irregular"},
  {name:"México 70", lat:-23.9650, lon:-46.4056, mun:"S.VICENTE", desc:"Comunidade"},
  {name:"Vila Margarida", lat:-23.9530, lon:-46.3990, mun:"S.VICENTE", desc:"Área de risco"},
  {name:"Jardim Rio Branco", lat:-23.9460, lon:-46.4100, mun:"S.VICENTE", desc:"Comunidade"},
  {name:"Vila Baiana", lat:-23.9894, lon:-46.2667, mun:"GUARUJA", desc:"Comunidade Vicente de Carvalho"},
  {name:"Favela do Morrinhos", lat:-23.9940, lon:-46.2590, mun:"GUARUJA", desc:"Área de ocupação"},
  {name:"Vila Zilda", lat:-23.9970, lon:-46.2530, mun:"GUARUJA", desc:"Comunidade no Guarujá"},
  {name:"Jardim Progresso", lat:-24.0050, lon:-46.2620, mun:"GUARUJA", desc:"Área de ocupação"},
  {name:"Sítio do Campo", lat:-24.0152, lon:-46.4350, mun:"PRAIA GRANDE", desc:"Região com alto índice criminal"},
  {name:"Nova Mirim", lat:-24.0290, lon:-46.4480, mun:"PRAIA GRANDE", desc:"Região periférica"},
  {name:"Quietude", lat:-24.0220, lon:-46.4250, mun:"PRAIA GRANDE", desc:"Área com ocupações irregulares"},
  {name:"Vila Esperança (Cubatão)", lat:-23.8870, lon:-46.4180, mun:"CUBATAO", desc:"Comunidade em Cubatão"},
  {name:"Cota 200", lat:-23.8750, lon:-46.4050, mun:"CUBATAO", desc:"Ocupação em área de serra"},
  {name:"Pilões", lat:-23.8920, lon:-46.3950, mun:"CUBATAO", desc:"Área de risco geológico"},
];

// State
let activeLayers = {criminais:true, celulares:true, veiculos:true, favelas:true};
let currentView = 'heat';
let map, heatLayer, markersGroup, clusterGroup, favelasGroup;
let filteredData = {c:[], cel:[], v:[]};

// Colors
const COLORS = {criminais:'#ef4444', celulares:'#f59e0b', veiculos:'#3b82f6'};

function initMap() {
  map = L.map('map', {
    center:[-23.98, -46.35],
    zoom:11,
    zoomControl:true,
    attributionControl:true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO | Dados: SSP-SP',
    maxZoom:19
  }).addTo(map);

  markersGroup = L.layerGroup();
  favelasGroup = L.layerGroup();

  // Add favela markers
  FAVELAS.forEach(f => {
    const marker = L.circleMarker([f.lat, f.lon], {
      radius:8, fillColor:'#a855f7', fillOpacity:0.7,
      color:'#a855f7', weight:2, opacity:0.9
    });
    marker.bindPopup(`
      <div class="popup-title">⚠ ${f.name}</div>
      <div class="popup-row"><span class="popup-label">Município</span><span class="popup-val">${f.mun}</span></div>
      <div class="popup-row"><span class="popup-label">Obs</span><span class="popup-val">${f.desc}</span></div>
    `);
    favelasGroup.addLayer(marker);
  });
  favelasGroup.addTo(map);

  applyFilters();
}

function applyFilters() {
  const munFilter = document.getElementById('filterMunicipio').value;
  const natFilter = document.getElementById('filterNatureza').value;

  filteredData.c = RAW.c.filter(d => {
    if (munFilter && d[8] !== munFilter) return false;
    if (natFilter && !d[3].toUpperCase().includes(natFilter)) return false;
    return true;
  });
  filteredData.cel = RAW.cel.filter(d => {
    if (munFilter && d[7] !== munFilter) return false;
    if (natFilter) {
      const rub = d[2].toUpperCase();
      if (natFilter === 'FURTO' && !rub.includes('FURTO')) return false;
      if (natFilter === 'ROUBO' && !rub.includes('ROUBO')) return false;
      if (natFilter === 'HOMICÍDIO') return false;
      if (natFilter === 'TRÁFICO') return false;
      if (natFilter === 'LESÃO') return false;
    }
    return true;
  });
  filteredData.v = RAW.v.filter(d => {
    if (munFilter && d[7] !== munFilter) return false;
    if (natFilter) {
      const rub = d[2].toUpperCase();
      if (natFilter === 'FURTO' && !rub.includes('FURTO')) return false;
      if (natFilter === 'ROUBO' && !rub.includes('ROUBO')) return false;
      if (natFilter === 'HOMICÍDIO') return false;
      if (natFilter === 'TRÁFICO') return false;
      if (natFilter === 'LESÃO') return false;
    }
    return true;
  });

  // Update counts
  document.getElementById('cnt-criminais').textContent = filteredData.c.length.toLocaleString('pt-BR');
  document.getElementById('cnt-celulares').textContent = filteredData.cel.length.toLocaleString('pt-BR');
  document.getElementById('cnt-veiculos').textContent = filteredData.v.length.toLocaleString('pt-BR');

  // Stats
  const allCrim = filteredData.c;
  const roubos = allCrim.filter(d => d[3].includes('ROUBO')).length
    + filteredData.cel.filter(d => d[2].toUpperCase().includes('ROUBO')).length
    + filteredData.v.filter(d => d[2].toUpperCase().includes('ROUBO')).length;
  const furtos = allCrim.filter(d => d[3].includes('FURTO')).length
    + filteredData.cel.filter(d => d[2].toUpperCase().includes('FURTO')).length
    + filteredData.v.filter(d => d[2].toUpperCase().includes('FURTO')).length;
  const homicidios = allCrim.filter(d => d[3].includes('HOMICÍDIO DOLOSO') || d[3].includes('LATROCÍNIO')).length;
  const total = filteredData.c.length + filteredData.cel.length + filteredData.v.length;

  document.getElementById('stat-total').textContent = total.toLocaleString('pt-BR');
  document.getElementById('stat-roubos').textContent = roubos.toLocaleString('pt-BR');
  document.getElementById('stat-furtos').textContent = furtos.toLocaleString('pt-BR');
  document.getElementById('stat-homicidios').textContent = homicidios.toLocaleString('pt-BR');

  renderView();

  // Zoom to municipality if filtered
  if (munFilter) {
    const pts = [...filteredData.c.map(d=>[d[0],d[1]]), ...filteredData.cel.map(d=>[d[0],d[1]]), ...filteredData.v.map(d=>[d[0],d[1]])];
    if (pts.length > 0) {
      const bounds = L.latLngBounds(pts);
      map.fitBounds(bounds, {padding:[60,60]});
    }
  }
}

function getActivePoints() {
  let pts = [];
  if (activeLayers.criminais) {
    filteredData.c.forEach(d => pts.push({lat:d[0], lon:d[1], src:'criminais', d:d}));
  }
  if (activeLayers.celulares) {
    filteredData.cel.forEach(d => pts.push({lat:d[0], lon:d[1], src:'celulares', d:d}));
  }
  if (activeLayers.veiculos) {
    filteredData.v.forEach(d => pts.push({lat:d[0], lon:d[1], src:'veiculos', d:d}));
  }
  return pts;
}

function renderView() {
  // Clean
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  markersGroup.clearLayers();
  map.removeLayer(markersGroup);

  const pts = getActivePoints();

  if (currentView === 'heat') {
    const heatPts = pts.map(p => [p.lat, p.lon, 0.6]);
    heatLayer = L.heatLayer(heatPts, {
      radius:18, blur:22, maxZoom:15, max:1.0,
      gradient:{0.1:'#064e3b', 0.3:'#22c55e', 0.5:'#eab308', 0.7:'#f97316', 0.9:'#ef4444', 1.0:'#7f1d1d'}
    }).addTo(map);
  }
  else if (currentView === 'points') {
    pts.forEach(p => {
      const color = COLORS[p.src];
      const cm = L.circleMarker([p.lat, p.lon], {
        radius:4, fillColor:color, fillOpacity:0.6,
        color:color, weight:1, opacity:0.8
      });
      cm.bindPopup(makePopup(p));
      markersGroup.addLayer(cm);
    });
    markersGroup.addTo(map);
  }
  else if (currentView === 'cluster') {
    // Simple grid-based clustering
    const grid = {};
    const zoom = map.getZoom();
    const cellSize = zoom < 12 ? 0.02 : zoom < 14 ? 0.005 : 0.002;
    pts.forEach(p => {
      const key = Math.round(p.lat/cellSize) + ',' + Math.round(p.lon/cellSize);
      if (!grid[key]) grid[key] = {lat:0, lon:0, count:0, pts:[]};
      grid[key].lat += p.lat;
      grid[key].lon += p.lon;
      grid[key].count++;
      grid[key].pts.push(p);
    });

    Object.values(grid).forEach(g => {
      const lat = g.lat / g.count;
      const lon = g.lon / g.count;
      const r = Math.min(Math.max(Math.sqrt(g.count) * 3, 6), 35);
      const color = g.count > 20 ? '#ef4444' : g.count > 10 ? '#f97316' : g.count > 5 ? '#eab308' : '#22c55e';
      const cm = L.circleMarker([lat, lon], {
        radius:r, fillColor:color, fillOpacity:0.6,
        color:color, weight:1.5, opacity:0.8
      });
      cm.bindPopup(`<div class="popup-title">${g.count} ocorrências nesta área</div>`);
      markersGroup.addLayer(cm);
    });
    markersGroup.addTo(map);
  }

  // Favelas
  if (activeLayers.favelas) {
    favelasGroup.addTo(map);
  } else {
    map.removeLayer(favelasGroup);
  }
}

function makePopup(p) {
  const d = p.d;
  if (p.src === 'criminais') {
    return `<div class="popup-title">${d[3]}</div>
      <div class="popup-row"><span class="popup-label">Rubrica</span><span class="popup-val">${d[2]}</span></div>
      <div class="popup-row"><span class="popup-label">Data</span><span class="popup-val">${d[4]} ${d[5]!=='NULL'?d[5]:''}</span></div>
      <div class="popup-row"><span class="popup-label">Local</span><span class="popup-val">${d[7]}</span></div>
      <div class="popup-row"><span class="popup-label">Bairro</span><span class="popup-val">${d[6]}</span></div>
      <div class="popup-row"><span class="popup-label">Município</span><span class="popup-val">${d[8]}</span></div>
      <div class="popup-row"><span class="popup-label">Tipo Local</span><span class="popup-val">${d[9]}</span></div>`;
  } else if (p.src === 'celulares') {
    return `<div class="popup-title">Celular Subtraído</div>
      <div class="popup-row"><span class="popup-label">Rubrica</span><span class="popup-val">${d[2]}</span></div>
      <div class="popup-row"><span class="popup-label">Data</span><span class="popup-val">${d[3]} ${d[4]!=='NULL'?d[4]:''}</span></div>
      <div class="popup-row"><span class="popup-label">Local</span><span class="popup-val">${d[6]}</span></div>
      <div class="popup-row"><span class="popup-label">Bairro</span><span class="popup-val">${d[5]}</span></div>
      <div class="popup-row"><span class="popup-label">Município</span><span class="popup-val">${d[7]}</span></div>`;
  } else {
    return `<div class="popup-title">Veículo Subtraído</div>
      <div class="popup-row"><span class="popup-label">Rubrica</span><span class="popup-val">${d[2]}</span></div>
      <div class="popup-row"><span class="popup-label">Data</span><span class="popup-val">${d[3]} ${d[4]!=='NULL'?d[4]:''}</span></div>
      <div class="popup-row"><span class="popup-label">Local</span><span class="popup-val">${d[6]}</span></div>
      <div class="popup-row"><span class="popup-label">Bairro</span><span class="popup-val">${d[5]}</span></div>
      <div class="popup-row"><span class="popup-label">Município</span><span class="popup-val">${d[7]}</span></div>
      <div class="popup-row"><span class="popup-label">Tipo Veículo</span><span class="popup-val">${d[9]||''}</span></div>`;
  }
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderView();
}

function toggleLayer(btn) {
  const layer = btn.dataset.layer;
  activeLayers[layer] = !activeLayers[layer];
  btn.classList.toggle('active');
  renderView();
}

// Re-cluster on zoom change
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  map.on('zoomend', () => {
    if (currentView === 'cluster') renderView();
  });
});
</script>
